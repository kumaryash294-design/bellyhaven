      <stop offset="55%" stop-color="#f6dbe3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f7dce0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6d6be"/>
      <stop offset="55%" stop-color="#87b296"/>
