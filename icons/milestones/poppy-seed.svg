  </defs>
  <circle cx="98" cy="96" r="76" fill="url(#bgHalo)"/>
  <ellipse cx="106" cy="104" rx="58" ry="52" fill="#f6dbe3" opacity="0.34" filter="url(#washBlur)"/>
