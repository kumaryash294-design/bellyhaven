<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Poppy Seed watercolor illustration">
  <defs>
    <radialGradient id="bgHalo" cx="46%" cy="42%" r="54%">
