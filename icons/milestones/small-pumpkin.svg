<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Small Pumpkin watercolor illustration">
  <defs>
    <radialGradient id="bgHalo" cx="46%" cy="42%" r="54%">
      <stop offset="0%" stop-color="#fff9fa" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fbe2cf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f7dce0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6d6be"/>
      <stop offset="55%" stop-color="#87b296"/>
      <stop offset="100%" stop-color="#648f73"/>
    </linearGradient>
    <linearGradient id="stemWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b08e7b"/>
      <stop offset="100%" stop-color="#7c5d4e"/>
    </linearGradient>
    <filter id="washBlur" x="-20%" y="-20%" width="140%" height="140%">
