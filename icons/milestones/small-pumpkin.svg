    </filter>
        <radialGradient id="pumpGrad" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fbd09d"/>
      <stop offset="55%" stop-color="#ec925f"/>
      <stop offset="100%" stop-color="#c3643d"/>
    </radialGradient>
  </defs>
  <circle cx="98" cy="96" r="76" fill="url(#bgHalo)"/>
  <ellipse cx="106" cy="104" rx="58" ry="52" fill="#fbe2cf" opacity="0.34" filter="url(#washBlur)"/>
  <ellipse cx="100" cy="165" rx="48" ry="9" fill="#c99ca6" opacity="0.28" filter="url(#paintBlur)"/>
    <path d="M100 58 C100 44 106 36 114 32" fill="none" stroke="url(#stemWood)" stroke-width="6" stroke-linecap="round"/>
  <path d="M112 42 C124 34 134 38 130 48 C124 52 120 46 124 42" fill="none" stroke="url(#leafSage)" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="76" cy="104" rx="24" ry="42" fill="url(#pumpGrad)"/>
  <ellipse cx="124" cy="104" rx="24" ry="42" fill="url(#pumpGrad)"/>
  <ellipse cx="100" cy="105" rx="24" ry="45" fill="url(#pumpGrad)"/>
  <ellipse cx="88" cy="82" rx="8" ry="16" fill="#ffebd4" opacity="0.42" filter="url(#paintBlur)"/>
