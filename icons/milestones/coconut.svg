    </radialGradient>
    <radialGradient id="cocoMilk" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f6efe9"/>
      <stop offset="100%" stop-color="#e3d5cc"/>
    </radialGradient>
  </defs>
  <circle cx="98" cy="96" r="76" fill="url(#bgHalo)"/>
  <ellipse cx="106" cy="104" rx="58" ry="52" fill="#f2e4da" opacity="0.34" filter="url(#washBlur)"/>
  <ellipse cx="100" cy="165" rx="46" ry="9" fill="#c99ca6" opacity="0.28" filter="url(#paintBlur)"/>
    <circle cx="88" cy="96" r="42" fill="url(#cocoShell)"/>
  <g fill="#4d3123" opacity="0.65">
    <circle cx="72" cy="78" r="3.5"/>
